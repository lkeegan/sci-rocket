site_name: sci-rocket
repo_url: https://github.com/lauren-saunders-lab/sci-rocket
repo_name: lauren-saunders-lab/sci-rocket
use_directory_urls: false
nav:
  - Home: index.md
  - Sample-Sheet and Barcodes: overview_files.md
  - Methodology: overview_methodology.md
  - LSF Profile: config_lsf.md
  - Config Reference: config_reference.md
theme:
  name: material
  logo: assets/logo.svg
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - gen-files:
      scripts:
        - docs/scripts/generate_config_reference.py
